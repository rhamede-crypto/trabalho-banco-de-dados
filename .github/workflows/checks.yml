name: Verificar aplicação
on:
  push:
    branches:
      [main, develop, "feature/**", "bugfix/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
