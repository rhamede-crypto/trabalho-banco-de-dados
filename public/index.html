<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locais de estudo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="layout">
    <section class="panel">
      <h1>Locais de estudo</h1>
      <p id="status" role="status" aria-live="polite"></p>
      <form id="place-form">
        <input id="place-id" type="hidden">
        <label for="name">Nome</label>
        <input id="name" name="name" maxlength="120" required>
        <label for="description">Descrição</label>
        <textarea id="description" name="description" maxlength="2000"></textarea>
        <label for="latitude">Latitude</label>
        <input id="latitude" name="latitude" type="number" step="any" min="-90" max="90" required>
        <label for="longitude">Longitude</label>
        <input id="longitude" name="longitude" type="number" step="any" min="-180" max="180" required>
        <div class="row">
          <button id="save-btn" type="submit">Salvar</button>
          <button id="cancel-btn" type="button">Cancelar</button>
          <button id="delete-btn" type="button" hidden>Excluir</button>
        </div>
      </form>
      <hr>
      <form id="search-form">
        <label for="query">Buscar endereço</label>
        <div class="row">
          <input id="query" name="query" minlength="3" placeholder="Rua, bairro, cidade">
          <button id="search-btn" type="submit">Buscar</button>
          <button id="search-cancel-btn" type="button">Cancelar busca</button>
        </div>
        <p class="hint">Busca por Nominatim (OpenStreetMap), sem autocomplete por tecla.</p>
      </form>
      <ul id="search-results"></ul>
      <h2>Locais cadastrados</h2>
      <ul id="places"></ul>
    </section>
    <section class="map-wrap">
      <div id="map" aria-label="Mapa de locais de estudo"></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
